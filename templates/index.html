<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amigo Secreto</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; }
    select, input, button { width: 100%; padding: .6rem; margin-top: .3rem; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 1.2rem; cursor: pointer; }
    .result { margin-top: 1.5rem; padding: 1rem; background: #e8f5e9; border-radius: 6px; }
    .error { margin-top: 1.5rem; padding: 1rem; background: #ffebee; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Amigo Secreto</h1>

  <form method="post">
    <label for="category">Categoria</label>
    <select id="category" name="category">
      {% for category in categories %}
        <option value="{{ category }}" {% if category == selected %}selected{% endif %}>{{ category|capitalize }}</option>
      {% endfor %}
    </select>

    <label for="name">Seu nome</label>
    <input id="name" name="name" type="text" required autofocus>

    <button type="submit">Sortear</button>
  </form>

  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="{{ category }}">{{ message }}</div>
  {% endfor %}
</body>
</html>
